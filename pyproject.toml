[project]
name = "digital-store-bot"
version = "1.1.0"
description = "Loja digital privada para Telegram com Stars, PIX e entrega automatica"
requires-python = ">=3.11"
dependencies = [
  "aiogram~=3.31.0",
  "aiosqlite~=0.22.0",
  "aiohttp~=3.14.0",
  "python-dotenv~=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
